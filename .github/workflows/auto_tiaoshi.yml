name: IPTV 调试自动抓取

on:
  schedule:
    # 每天北京时间凌晨4点执行（UTC时间20:00）
    # cron 表达式：分 时 日 月 星期
    - cron: '0 20 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 运行抓取脚本
        run: python tiaoshi.py
        env:
          URL_LIST_FILE: "网址列表.txt"
          TEMPLATE_FILE: "节目模板.txt"
          OUTPUT_FILE: "临时.txt"

      - name: 上传结果文件
        uses: actions/upload-artifact@v4
        with:
          name: iptv-result  # 工件名称，可在GitHub页面下载
          path: 临时.txt
          retention-days: 1  # 只保留1天，节省存储空间
